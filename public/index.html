<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1210">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Meridian links the Yahoo Finance tape to live headlines, and reads corporate credit against the Treasury curve.">
  <title>Meridian</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,550;1,6..72,450&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <div class="mark">Meridian</div>
        <div class="tag" id="tagline">Tape, wire, and the print between them</div>
      </div>
      <div class="clockbox">
        <div class="clock" id="clock">—</div>
        <div class="pills" id="pills"></div>
      </div>
    </header>
    <main id="main">
      <section class="loading">
        <p class="kicker">Opening the book</p>
        <h1>Pulling Yahoo Finance and the wires.</h1>
        <p class="muted">Quotes, 5-minute bars, and headlines from the sources that answer.</p>
      </section>
    </main>
    <nav class="nav" aria-label="Sections">
      <button type="button" data-view="tape" class="on" aria-current="page">Tape</button>
      <button type="button" data-view="chart">Chart</button>
      <button type="button" data-view="wire">Wire</button>
      <button type="button" data-view="brief">Brief</button>
      <button type="button" data-view="bonds">Bonds</button>
    </nav>
  </div>
  <script src="/vendor/lightweight-charts.standalone.production.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
